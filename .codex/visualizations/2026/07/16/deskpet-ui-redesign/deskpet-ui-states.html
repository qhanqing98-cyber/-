<div id="deskpet-ui-states">
  <div class="viz-controls" aria-label="桌宠界面状态">
    <button type="button" class="btn btn-primary" data-state="menu" aria-pressed="true">快捷菜单</button>
    <button type="button" class="btn" data-state="status" aria-pressed="false">状态面板</button>
    <button type="button" class="btn" data-state="word" aria-pressed="false">单词卡片</button>
  </div>

  <section class="card preview" aria-live="polite">
    <div class="pet-stage">
      <div class="pet" aria-label="桌宠角色">PET</div>

      <div class="ui menu-ui is-visible" data-panel="menu">
        <div class="ui-head"><span>和我互动</span><span class="text-muted">右键菜单</span></div>
        <div class="action-grid">
          <button type="button" class="action is-selected"><span>＋</span><b>喂食</b><small>恢复饱食度</small></button>
          <button type="button" class="action"><span>♡</span><b>摸摸它</b><small>提升心情</small></button>
          <button type="button" class="action"><span>A</span><b>选择词本</b><small>切换学习内容</small></button>
          <button type="button" class="action"><span>↥</span><b>导入词表</b><small>TXT / CSV / JSON</small></button>
          <button type="button" class="action"><span>◷</span><b>提醒间隔</b><small>调整出现频率</small></button>
          <button type="button" class="action danger"><span>−</span><b>删除词本</b><small>管理本地内容</small></button>
        </div>
        <button type="button" class="quit">×&nbsp; 保存并退出</button>
      </div>

      <div class="ui status-ui" data-panel="status">
        <div class="ui-head"><span>散步中</span><span class="online">● 在线</span></div>
        <div class="metric"><span>饱食</span><i><b style="width:72%"></b></i><strong>72</strong></div>
        <div class="metric"><span>心情</span><i><b style="width:88%"></b></i><strong>88</strong></div>
        <div class="metric"><span>精力</span><i><b style="width:54%"></b></i><strong>54</strong></div>
      </div>

      <div class="ui word-ui" data-panel="word">
        <div class="word-top"><span>今日单词</span><span class="viz-badge">12 / 300</span></div>
        <strong>interaction</strong>
        <p>n. 相互作用；互动；人与宠物之间自然、轻松的交流体验</p>
        <div class="word-foot"><span>点击卡片继续</span><kbd>Space</kbd></div>
      </div>
    </div>
  </section>
</div>

<style>
  #deskpet-ui-states { display:grid; gap:12px; }
  #deskpet-ui-states .preview { padding:0; overflow:hidden; }
  #deskpet-ui-states .pet-stage { position:relative; min-height:430px; display:grid; place-items:end center; padding:24px; background:color-mix(in srgb, var(--muted) 35%, transparent); }
  #deskpet-ui-states .pet { width:110px; height:145px; display:grid; place-items:center; border-radius:55px 55px 32px 32px; background:var(--secondary); color:var(--secondary-foreground); font-weight:500; }
  #deskpet-ui-states .ui { display:none; position:absolute; background:color-mix(in srgb, var(--popover) 94%, transparent); color:var(--popover-foreground); border:1px solid var(--border); border-radius:14px; box-shadow:0 14px 40px color-mix(in srgb, var(--foreground) 18%, transparent); }
  #deskpet-ui-states .ui.is-visible { display:block; }
  #deskpet-ui-states .ui-head { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); font-weight:500; }
  #deskpet-ui-states .menu-ui { width:300px; top:18px; }
  #deskpet-ui-states .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; }
  #deskpet-ui-states .action { display:grid; grid-template-columns:24px 1fr; grid-template-rows:auto auto; gap:2px 8px; padding:9px; text-align:left; color:var(--popover-foreground); background:transparent; border:1px solid transparent; border-radius:9px; }
  #deskpet-ui-states .action span { grid-row:1 / 3; align-self:center; color:var(--muted-foreground); }
  #deskpet-ui-states .action b { font-weight:500; }
  #deskpet-ui-states .action small { color:var(--muted-foreground); }
  #deskpet-ui-states .action.is-selected { background:var(--primary); color:var(--primary-foreground); }
  #deskpet-ui-states .action.is-selected span, #deskpet-ui-states .action.is-selected small { color:inherit; }
  #deskpet-ui-states .action.danger b { color:var(--destructive); }
  #deskpet-ui-states .quit { width:calc(100% - 16px); margin:0 8px 8px; padding:8px; border:0; border-top:1px solid var(--border); background:transparent; color:var(--destructive); }
  #deskpet-ui-states .status-ui { width:230px; right:38px; top:110px; padding-bottom:10px; }
  #deskpet-ui-states .online { color:var(--muted-foreground); font-weight:400; }
  #deskpet-ui-states .metric { display:grid; grid-template-columns:38px 1fr 24px; align-items:center; gap:8px; padding:7px 14px 0; }
  #deskpet-ui-states .metric i { height:6px; background:var(--muted); border-radius:9px; overflow:hidden; }
  #deskpet-ui-states .metric i b { display:block; height:100%; background:var(--primary); }
  #deskpet-ui-states .metric strong { font-weight:500; text-align:right; }
  #deskpet-ui-states .word-ui { width:min(360px, calc(100% - 34px)); top:44px; padding:16px; }
  #deskpet-ui-states .word-top, #deskpet-ui-states .word-foot { display:flex; justify-content:space-between; align-items:center; color:var(--muted-foreground); }
  #deskpet-ui-states .word-ui > strong { display:block; margin:14px 0 8px; font-weight:500; font-size:1.7em; }
  #deskpet-ui-states .word-ui p { margin:0 0 14px; }
  #deskpet-ui-states .word-foot { padding-top:10px; border-top:1px solid var(--border); }
  #deskpet-ui-states kbd { padding:2px 6px; border:1px solid var(--border); border-radius:5px; }
</style>

<script>
  (() => {
    const root = document.getElementById('deskpet-ui-states');
    const buttons = [...root.querySelectorAll('[data-state]')];
    const panels = [...root.querySelectorAll('[data-panel]')];
    buttons.forEach((button) => button.addEventListener('click', () => {
      buttons.forEach((item) => {
        const selected = item === button;
        item.setAttribute('aria-pressed', String(selected));
        item.classList.toggle('btn-primary', selected);
      });
      panels.forEach((panel) => panel.classList.toggle('is-visible', panel.dataset.panel === button.dataset.state));
    }));
  })();
</script>
